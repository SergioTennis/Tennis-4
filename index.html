<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c2f"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tennis 4"><title>Tennis 4 Shared</title><style>
:root{--g:#146c4b;--bg:#f3f7f4;--c:#fff;--t:#17211c;--m:#68756d;--line:#dbe4de;--r:#a33535}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t)}header{background:linear-gradient(135deg,#123c2f,#1d7957);color:white;padding:calc(20px + env(safe-area-inset-top)) 15px 17px}h1{font-size:23px;margin:0}.sub{font-size:12px;opacity:.85}main{max-width:760px;margin:auto;padding:13px}.card{background:var(--c);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px;box-shadow:0 6px 18px #0000000d}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:11px}.tabs button{background:var(--c);color:var(--t);padding:9px 3px;font-size:11px}.tabs .on{background:var(--g);color:#fff}button{border:0;border-radius:10px;padding:11px 12px;background:var(--g);color:white;font:inherit;font-weight:700;cursor:pointer}h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;color:var(--m);font-size:12px;margin:5px 0}input,select{width:100%;padding:10px;border:1px solid #cbd6cf;border-radius:9px;background:var(--c);color:var(--t);font:inherit}.full{width:100%;margin-top:10px}.note{padding:10px;border-radius:10px;background:#def1e7;font-size:13px;margin:10px 0}.hide{display:none!important}.stat{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}.small{font-size:12px;color:var(--m)}.big{font-weight:800;color:var(--g)}.red{color:var(--r)}.secondary{background:#e8efea;color:#294638}.danger{background:#fff;color:var(--r);border:1px solid #ddb6b6}.status{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.dot{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block;margin-right:5px}.online{background:#24a05a}.offline{background:#c98d19}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 4px;text-align:left;border-bottom:1px solid var(--line)}.login{max-width:430px;margin:30px auto}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:10px;background:#f7faf8;border-radius:10px;border:1px solid var(--line)}.metric b{display:block;color:var(--g);font-size:18px}@media(max-width:500px){.grid{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{--bg:#101512;--c:#18201b;--t:#eef5f0;--m:#a6b5ac;--line:#334139}.tabs button,input,select{background:#202a24;color:var(--t)}.note{background:#1d3a2d}.metric{background:#121814}.secondary{background:#29372f;color:#fff}}
</style></head><body><header><h1>🎾 Tennis 4</h1><div class="sub">Calendario e costi condivisi</div></header><main><section id="login" class="login"><div class="card"><h2>Accedi al gruppo</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="full">Accedi</button><div id="loginMsg" class="small red" style="margin-top:9px"></div></div></section><section id="app" class="hide"><div class="status card"><span><span id="netDot" class="dot"></span><span id="netText">Connessione…</span></span><span><span id="who" class="small"></span> <button id="logout" class="secondary" style="padding:6px 8px">Esci</button></span></div><div class="tabs"><button class="on" data-t="play">Gioca</button><button data-t="cal">Calendario</button><button data-t="sum">Riepilogo</button><button data-t="settings">Impostazioni</button></div>
<section id="play"><div class="card"><h2>Registra sessione</h2><div class="grid"><div><label>Data</label><input id="date" type="date"></div><div><label>Durata</label><select id="hours"><option value="1">1 ora</option><option value="2">2 ore</option><option value="0.5">30 minuti</option></select></div><div><label>Giocatore A</label><select id="pa"></select></div><div><label>Giocatore B</label><select id="pb"></select></div></div><div id="costPreview" class="note"></div><button id="addSession" class="full">Salva per tutti</button></div><div class="card"><h2>Prossimi turni</h2><div id="upcoming"></div></div></section>
<section id="cal" class="hide"><div class="card"><h2>Calendario condiviso</h2><div class="grid"><div><label>Mese</label><input id="fm" type="month"></div><div><label>Giocatore</label><select id="fp"><option value="">Tutti</option></select></div></div><div id="sessions"></div></div></section>
<section id="sum" class="hide"><div class="card"><h2>Stagione</h2><div id="metrics" class="metrics"></div></div><div class="card"><h2>Riepilogo giocatori</h2><div id="summary"></div></div><div class="card"><h2>Mensile</h2><div id="monthly"></div></div></section>
<section id="settings" class="hide"><div id="adminBox" class="card"><h2>Impostazioni amministratore</h2><div id="names"></div><label>Ospite</label><input id="guest"><div class="grid"><div><label>Costo campo/ora €</label><input id="hourly" type="number" min="0" step="0.01"></div><div><label>Inizio stagione</label><input id="start" type="date"></div><div><label>Fine stagione</label><input id="end" type="date"></div><div><label>Giorno 1</label><select id="day1"></select></div><div><label>Ora 1</label><input id="time1" type="time"></div><div><label>Giorno 2</label><select id="day2"></select></div><div><label>Ora 2</label><input id="time2" type="time"></div></div><button id="saveSettings" class="full">Salva impostazioni condivise</button></div><div class="card"><h2>Esporta</h2><button id="csv" class="secondary full">Esporta CSV</button><button id="json" class="secondary full">Backup JSON</button></div></section></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,collection,addDoc,onSnapshot,deleteDoc,serverTimestamp,enableIndexedDbPersistence}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBKhvVwPAUt2drJe2uvD7r8mXN46Vrezac',authDomain:'tennis-4-shared.firebaseapp.com',projectId:'tennis-4-shared',storageBucket:'tennis-4-shared.firebasestorage.app',messagingSenderId:'317149058277',appId:'1:317149058277:web:2e0d7de243d1ed009a700c'};const ADMIN='bV8RL4AjzdcYbepZvoXvewA0kfi2',GROUP='tennis-bolzano',allowed=['bV8RL4AjzdcYbepZvoXvewA0kfi2','itNCtIevh9PbELkKz6GcgtO308G3','XsVfeVF0iOhVN8FtbC5LeuJlg6Y2','TeZVa2XCfVYGns4jOoLEwboUp9l1'];const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);try{await enableIndexedDbPersistence(db)}catch(e){}const $=q=>document.querySelector(q),days=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];let cfg={players:['Sergio','Oskar','Ludwig','Stefan'],guest:'Ospite',hourlyCost:24,start:'',end:'',day1:1,time1:'18:00',day2:5,time2:'18:00'},sessions=[],unsub=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n),localISO=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),fmt=d=>new Date(d+'T12:00').toLocaleDateString('it-IT');$('#date').value=localISO(new Date());
function alloc(s){let c=Object.fromEntries(cfg.players.map(p=>[p,0])),h=Object.fromEntries([...cfg.players,cfg.guest].map(p=>[p,0])),tot=cfg.hourlyCost*s.hours;if(s.a===s.b){h[s.a]=(h[s.a]||0)+s.hours;if(s.a===cfg.guest)cfg.players.forEach(p=>c[p]+=tot/4);else c[s.a]+=tot}else{h[s.a]=(h[s.a]||0)+s.hours/2;h[s.b]=(h[s.b]||0)+s.hours/2;[s.a,s.b].forEach(p=>p===cfg.guest?cfg.players.forEach(z=>c[z]+=tot/8):c[p]+=tot/2)}return{c,h}}
function opts(el,val){let ppl=[...cfg.players,cfg.guest];el.innerHTML=ppl.map(p=>`<option>${esc(p)}</option>`).join('');if(ppl.includes(val))el.value=val}function preview(){let s={a:$('#pa').value,b:$('#pb').value,hours:+$('#hours').value},z=alloc(s);$('#costPreview').innerHTML=cfg.players.filter(p=>z.c[p]).map(p=>`${esc(p)}: <b>${eur(z.c[p])}</b>`).join(' · ')}
function activeSessions(){return sessions.filter(s=>(!cfg.start||s.date>=cfg.start)&&(!cfg.end||s.date<=cfg.end))}function upcoming(){let a=[],now=new Date();now.setHours(0,0,0,0);for(let i=0;i<28&&a.length<6;i++){let d=new Date(now);d.setDate(d.getDate()+i);for(const [day,time] of [[+cfg.day1,cfg.time1],[+cfg.day2,cfg.time2]])if(d.getDay()===day)a.push({date:localISO(d),time})}return a.filter(x=>!sessions.some(s=>s.date===x.date)).slice(0,6)}
function render(){let av=$('#pa').value,bv=$('#pb').value;opts($('#pa'),av||cfg.players[0]);opts($('#pb'),bv||cfg.players[1]);preview();$('#fp').innerHTML='<option value="">Tutti</option>'+[...cfg.players,cfg.guest].map(p=>`<option>${esc(p)}</option>`).join('');$('#upcoming').innerHTML=upcoming().map(x=>`<div class="stat"><span><b>${days[new Date(x.date+'T12:00').getDay()]}</b><br><span class="small">${fmt(x.date)} · ${x.time}</span></span><button class="secondary q" data-d="${x.date}">Registra</button></div>`).join('');document.querySelectorAll('.q').forEach(b=>b.onclick=()=>{const chosenDate=b.dataset.d;show('play');$('#date').value=chosenDate;window.scrollTo({top:0,behavior:'smooth'});preview();});renderSessions();renderSummary();renderSettings()}
function renderSessions(){let m=$('#fm').value,p=$('#fp').value,ss=activeSessions().filter(s=>(!m||s.date.startsWith(m))&&(!p||s.a===p||s.b===p)).sort((a,b)=>b.date.localeCompare(a.date));$('#sessions').innerHTML=ss.length?`<table><tr><th>Data</th><th>Giocatori</th><th>Ore</th><th></th></tr>${ss.map(s=>`<tr><td>${fmt(s.date)}</td><td>${esc(s.a)} / ${esc(s.b)}</td><td>${s.hours}</td><td><button class="danger del" data-id="${s.id}">×</button></td></tr>`).join('')}</table>`:'<div class="small" style="margin-top:12px">Nessuna sessione.</div>';document.querySelectorAll('.del').forEach(b=>{b.onclick=async()=>{const target=sessions.find(s=>s.id===b.dataset.id);const detail=target?(fmt(target.date)+': '+target.a+' / '+target.b+', '+target.hours+(target.hours===1?' ora':' ore')):'questa sessione';if(confirm('Confermi di voler cancellare '+detail+'?\n\nLa cancellazione sarà visibile a tutti i giocatori.')){await deleteDoc(doc(db,'groups',GROUP,'sessions',b.dataset.id));}};})}
function renderSummary(){let ss=activeSessions(),H=Object.fromEntries([...cfg.players,cfg.guest].map(p=>[p,0])),C=Object.fromEntries(cfg.players.map(p=>[p,0]));ss.forEach(s=>{let z=alloc(s);Object.entries(z.h).forEach(([p,v])=>H[p]=(H[p]||0)+v);Object.entries(z.c).forEach(([p,v])=>C[p]+=v)});let fh=ss.reduce((a,s)=>a+s.hours,0);$('#metrics').innerHTML=`<div class="metric"><b>${fh}</b><span class="small">ore campo</span></div><div class="metric"><b>${eur(fh*cfg.hourlyCost)}</b><span class="small">costo totale</span></div><div class="metric"><b>${ss.length}</b><span class="small">sessioni</span></div><div class="metric"><b>${H[cfg.guest]||0}</b><span class="small">ore ospite</span></div>`;$('#summary').innerHTML=cfg.players.map(p=>`<div class="stat"><span><b>${esc(p)}</b><br><span class="small">${H[p]} ore equivalenti</span></span><span class="big">${eur(C[p])}</span></div>`).join('');let M={};ss.forEach(s=>{let k=s.date.slice(0,7);M[k]??={h:0,c:0};M[k].h+=s.hours;M[k].c+=s.hours*cfg.hourlyCost});$('#monthly').innerHTML=Object.entries(M).sort().map(([k,v])=>`<div class="stat"><span>${new Date(k+'-01T12:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</span><span>${v.h} h · <b>${eur(v.c)}</b></span></div>`).join('')||'<span class="small">Nessun dato</span>'}
function renderSettings(){let isAdmin=auth.currentUser?.uid===ADMIN;$('#adminBox').classList.toggle('hide',!isAdmin);if(!isAdmin)return;$('#names').innerHTML=cfg.players.map((p,i)=>`<label>Giocatore ${i+1}</label><input class="pn" value="${esc(p)}">`).join('');$('#guest').value=cfg.guest;$('#hourly').value=cfg.hourlyCost;$('#start').value=cfg.start;$('#end').value=cfg.end;for(const id of ['day1','day2']){$('#'+id).innerHTML=days.map((d,i)=>`<option value="${i}">${d}</option>`).join('');$('#'+id).value=cfg[id]}$('#time1').value=cfg.time1;$('#time2').value=cfg.time2}
async function setup(user){if(!allowed.includes(user.uid)){await signOut(auth);throw Error('Utente non autorizzato')}$('#who').textContent=user.email;unsub.forEach(f=>f());unsub=[];unsub.push(onSnapshot(doc(db,'groups',GROUP),snap=>{if(snap.exists())cfg={...cfg,...snap.data()};render()},e=>console.error(e)));unsub.push(onSnapshot(collection(db,'groups',GROUP,'sessions'),snap=>{sessions=snap.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error(e)))}
onAuthStateChanged(auth,u=>{if(u){$('#login').classList.add('hide');$('#app').classList.remove('hide');setup(u).catch(e=>alert(e.message))}else{$('#app').classList.add('hide');$('#login').classList.remove('hide')}});$('#loginBtn').onclick=async()=>{try{$('#loginMsg').textContent='';await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value)}catch(e){$('#loginMsg').textContent='Accesso non riuscito. Controlla email e password.'}};$('#logout').onclick=()=>signOut(auth);$('#addSession').onclick=async()=>{if(!$('#date').value)return;await addDoc(collection(db,'groups',GROUP,'sessions'),{date:$('#date').value,hours:+$('#hours').value,a:$('#pa').value,b:$('#pb').value,createdBy:auth.currentUser.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});alert('Sessione condivisa salvata')};$('#saveSettings').onclick=async()=>{let p=[...document.querySelectorAll('.pn')].map(e=>e.value.trim());if(p.some(v=>!v)||new Set(p).size<4)return alert('Servono quattro nomi diversi');await setDoc(doc(db,'groups',GROUP),{players:p,guest:$('#guest').value.trim()||'Ospite',hourlyCost:Math.max(0,+$('#hourly').value||0),start:$('#start').value,end:$('#end').value,day1:+$('#day1').value,time1:$('#time1').value,day2:+$('#day2').value,time2:$('#time2').value,updatedAt:serverTimestamp()},{merge:true});alert('Impostazioni condivise salvate')};['pa','pb','hours'].forEach(i=>$('#'+i).onchange=preview);$('#fm').onchange=renderSessions;$('#fp').onchange=renderSessions;document.querySelector('.tabs').onclick=e=>e.target.dataset.t&&show(e.target.dataset.t);function show(id){document.querySelectorAll('#app>section').forEach(s=>s.classList.toggle('hide',s.id!==id));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===id));render()}function dl(n,t,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}$('#json').onclick=()=>dl('tennis-4-shared.json',JSON.stringify({cfg,sessions},null,2),'application/json');$('#csv').onclick=()=>{let r=[['Data','Ore','Giocatore A','Giocatore B'],...activeSessions().map(s=>[s.date,s.hours,s.a,s.b])];dl('tennis-4-shared.csv','\ufeff'+r.map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n'),'text/csv')};function net(){let on=navigator.onLine;$('#netDot').className='dot '+(on?'online':'offline');$('#netText').textContent=on?'Online':'Offline'}addEventListener('online',net);addEventListener('offline',net);net();
</script></body></html>
