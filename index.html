<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c2f"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tennis 4"><title>Tennis 4</title><style>
:root{--g:#146c4b;--bg:#f4f7f3;--c:#fff;--t:#17211c;--m:#68746d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t)}header{padding:calc(22px + env(safe-area-inset-top)) 16px 18px;background:#123c2f;color:white}header h1{margin:0;font-size:24px}main{max-width:700px;margin:auto;padding:14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}button{border:0;border-radius:11px;padding:11px;font-weight:700;background:var(--g);color:white}.tabs button{background:white;color:var(--t)}.tabs .on{background:var(--g);color:white}.card{background:var(--c);border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 6px 20px #0001}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:12px;color:var(--m);display:block;margin:5px 0}input,select{width:100%;padding:11px;border:1px solid #ccd6cf;border-radius:9px;background:white;font:inherit}.note{background:#def1e7;padding:10px;border-radius:10px;margin:10px 0;font-size:13px}.hide{display:none}.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e2e7e3}.big{font-weight:800;color:var(--g)}.small{font-size:12px;color:var(--m)}.danger{background:#a63737}.full{width:100%;margin-top:10px}@media(max-width:480px){.grid{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{--bg:#101512;--c:#18201b;--t:#eef5f0;--m:#a6b5ac}.tabs button,input,select{background:#222c26;color:var(--t)}.note{background:#1c3b2d}}
</style></head><body><header><h1>🎾 Tennis 4</h1><div class="small" style="color:#cfe4da">Ore giocate e ripartizione costi</div></header><main><div class="tabs"><button class="on" data-t="new">Nuova ora</button><button data-t="sum">Riepilogo</button><button data-t="set">Impostazioni</button></div>
<section id="new"><div class="card"><h2>Registra il gioco</h2><div class="grid"><div><label>Data</label><input id="date" type="date"></div><div><label>Durata</label><select id="hrs"><option value="1">1 ora</option><option value="2">2 ore</option><option value="0.5">30 minuti</option></select></div><div><label>Giocatore A</label><select id="a"></select></div><div><label>Giocatore B</label><select id="b"></select></div></div><div id="preview" class="note"></div><button id="save" class="full">Salva</button></div><div class="card"><h2>Ultime registrazioni</h2><div id="history"></div></div></section>
<section id="sum" class="hide"><div class="card"><h2>Riepilogo stagione</h2><div id="summary"></div></div></section>
<section id="set" class="hide"><div class="card"><h2>Giocatori</h2><div id="names"></div><label>Nome ospite</label><input id="guest"></div><div class="card"><h2>Costi e stagione</h2><div class="grid"><div><label>Costo campo / ora (€)</label><input id="cost" type="number" min="0" step="0.01"></div><div><label>Inizio</label><input id="start" type="date"></div><div><label>Fine</label><input id="end" type="date"></div></div><button id="saveSet" class="full">Salva impostazioni</button></div><div class="card"><button id="reset" class="danger full">Azzera tutte le registrazioni</button></div></section></main><script>
const K='tennis4_pwa_v1',D={p:['Giocatore 1','Giocatore 2','Giocatore 3','Giocatore 4'],g:'Ospite',cost:24,start:'',end:'',s:[]};let x;try{x=JSON.parse(localStorage.getItem(K))||structuredClone(D)}catch{x=structuredClone(D)}const $=q=>document.querySelector(q), eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),people=()=>[...x.p,x.g],persist=()=>localStorage.setItem(K,JSON.stringify(x));
function alloc(s){let c=Object.fromEntries(x.p.map(p=>[p,0])),h=Object.fromEntries(people().map(p=>[p,0])),tot=x.cost*s.h;if(s.a===s.b){h[s.a]+=s.h;if(s.a===x.g)x.p.forEach(p=>c[p]+=tot/4);else c[s.a]+=tot}else{h[s.a]+=s.h/2;h[s.b]+=s.h/2;[s.a,s.b].forEach(p=>p===x.g?x.p.forEach(z=>c[z]+=tot/8):c[p]+=tot/2)}return{c,h}}
function selects(){for(const [id,i] of [['a',0],['b',1]]){$('#'+id).innerHTML=people().map(p=>`<option>${esc(p)}</option>`).join('');$('#'+id).selectedIndex=i}preview()}
function preview(){let s={a:$('#a').value,b:$('#b').value,h:+$('#hrs').value},z=alloc(s);$('#preview').innerHTML=(s.a===s.b?'Intera ora a carico dello stesso giocatore. ':'')+x.p.filter(p=>z.c[p]).map(p=>`${esc(p)}: <b>${eur(z.c[p])}</b>`).join(' · ')}
function render(){selects();$('#names').innerHTML=x.p.map((p,i)=>`<label>Giocatore ${i+1}</label><input class="nm" value="${esc(p)}">`).join('');$('#guest').value=x.g;$('#cost').value=x.cost;$('#start').value=x.start;$('#end').value=x.end;let ss=x.s.filter(s=>(!x.start||s.d>=x.start)&&(!x.end||s.d<=x.end)).sort((a,b)=>b.d.localeCompare(a.d));$('#history').innerHTML=ss.length?ss.slice(0,10).map(s=>`<div class="stat"><span>${new Date(s.d+'T12:00').toLocaleDateString('it-IT')} · ${esc(s.a)} / ${esc(s.b)}</span><span>${s.h} h</span></div>`).join(''):'<div class="small">Nessuna registrazione.</div>';let H=Object.fromEntries(people().map(p=>[p,0])),C=Object.fromEntries(x.p.map(p=>[p,0]));ss.forEach(s=>{let z=alloc(s);for(let p in z.h)H[p]+=z.h[p];for(let p in z.c)C[p]+=z.c[p]});$('#summary').innerHTML=x.p.map(p=>`<div class="stat"><span><b>${esc(p)}</b><br><span class="small">${H[p].toLocaleString('it-IT')} ore equivalenti</span></span><span class="big">${eur(C[p])}</span></div>`).join('')+`<div class="stat"><span>${esc(x.g)}<br><span class="small">${H[x.g].toLocaleString('it-IT')} ore · costo redistribuito</span></span><span>${eur(0)}</span></div>`}
$('.tabs').onclick=e=>{if(!e.target.dataset.t)return;document.querySelectorAll('section').forEach(s=>s.classList.add('hide'));$('#'+e.target.dataset.t).classList.remove('hide');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===e.target));render()};['a','b','hrs'].forEach(i=>$('#'+i).onchange=preview);$('#date').value=new Date().toISOString().slice(0,10);$('#save').onclick=()=>{if(!$('#date').value)return;x.s.push({d:$('#date').value,h:+$('#hrs').value,a:$('#a').value,b:$('#b').value});persist();render();alert('Registrazione salvata')};$('#saveSet').onclick=()=>{let n=[...document.querySelectorAll('.nm')].map(e=>e.value.trim());if(n.some(v=>!v)||new Set(n).size<4)return alert('Inserisci quattro nomi diversi');x.p=n;x.g=$('#guest').value.trim()||'Ospite';x.cost=Math.max(0,+$('#cost').value||0);x.start=$('#start').value;x.end=$('#end').value;persist();render();alert('Impostazioni salvate')};$('#reset').onclick=()=>{if(confirm('Eliminare tutte le registrazioni?')){x.s=[];persist();render()}};render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
